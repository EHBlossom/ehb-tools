<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Present & Past Tense Practice | English House Blossom</title>
<style>
/* ===== FONTS ===== */
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@400;500;600;700&display=swap');

/* ===== ROOT VARIABLES ===== */
:root {
  --sky: #e0f4ff;
  --sky-mid: #b8e6ff;
  --emerald: #34c98a;
  --emerald-dark: #28a870;
  --emerald-light: #d0f5e8;
  --coral: #ff7f6b;
  --coral-light: #ffe5e0;
  --gold: #ffcc44;
  --gold-light: #fff5cc;
  --purple: #a78bfa;
  --purple-light: #ede9fe;
  --navy: #1e3a5f;
  --navy-mid: #2d5282;
  --text: #2d3748;
  --text-light: #718096;
  --white: #ffffff;
  --card-bg: rgba(255,255,255,0.92);
  --radius: 20px;
  --radius-sm: 12px;
  --shadow: 0 8px 32px rgba(30,58,95,0.12);
  --shadow-hover: 0 16px 48px rgba(30,58,95,0.18);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Quicksand', sans-serif;
  background: linear-gradient(145deg, #e0f4ff 0%, #d0f5e8 50%, #fef9e7 100%);
  min-height: 100vh;
  color: var(--text);
}

/* ===== HEADER ===== */
.header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 4px 20px rgba(30,58,95,0.25);
}
.header-title {
  font-family: 'Nunito', sans-serif;
  font-size: 1.2rem;
  font-weight: 900;
  color: var(--white);
  display: flex;
  align-items: center;
  gap: 8px;
}
.header-title span { font-size: 1.4rem; }
.voice-badge {
  background: var(--emerald);
  color: white;
  font-size: 0.7rem;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  gap: 4px;
}

/* ===== MAIN TABS ===== */
.tab-bar {
  display: flex;
  gap: 8px;
  padding: 16px 20px 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab-btn {
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 0.85rem;
  padding: 10px 18px;
  border-radius: 30px 30px 0 0;
  border: none;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
  background: rgba(255,255,255,0.5);
  color: var(--navy-mid);
}
.tab-btn.active {
  background: var(--white);
  color: var(--navy);
  box-shadow: 0 -4px 12px rgba(30,58,95,0.1);
}

/* ===== SECTION PANELS ===== */
.section-panel {
  display: none;
  padding: 20px;
  max-width: 860px;
  margin: 0 auto;
}
.section-panel.active { display: block; }

/* ===== LEVEL SELECTOR ===== */
.level-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.level-btn {
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 0.8rem;
  padding: 7px 16px;
  border-radius: 20px;
  border: 2.5px solid transparent;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--white);
  color: var(--text-light);
}
.level-btn.active { border-color: var(--emerald); color: var(--emerald-dark); background: var(--emerald-light); }
.level-btn:hover { border-color: var(--emerald); }

/* ===== CARD ===== */
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 28px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
  backdrop-filter: blur(10px);
  border: 1.5px solid rgba(255,255,255,0.7);
}
.card-title {
  font-family: 'Nunito', sans-serif;
  font-weight: 900;
  font-size: 1.1rem;
  color: var(--navy);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ===== SCORE BAR ===== */
.score-bar {
  display: flex;
  gap: 16px;
  align-items: center;
  background: var(--navy);
  color: white;
  border-radius: var(--radius);
  padding: 14px 20px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.score-item { font-family:'Nunito',sans-serif; font-weight:700; font-size:0.9rem; display:flex; align-items:center; gap:6px; }
.score-num { font-size:1.3rem; font-weight:900; color: var(--gold); }
.stamps-row { display:flex; gap:4px; flex-wrap:wrap; margin-left:auto; }
.stamp { font-size:1.4rem; filter: grayscale(1) opacity(0.3); transition:all 0.3s; }
.stamp.earned { filter: none; animation: stampPop 0.4s ease; }
@keyframes stampPop { 0%{transform:scale(0)} 60%{transform:scale(1.3)} 100%{transform:scale(1)} }

/* ===== QUESTION CARD ===== */
.question-scene {
  font-size:0.78rem;
  font-weight:700;
  color: var(--emerald-dark);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.question-type-badge {
  display: inline-block;
  font-size: 0.7rem;
  font-weight: 800;
  padding: 3px 10px;
  border-radius: 20px;
  margin-bottom: 10px;
}
.type-choose { background: var(--purple-light); color: var(--purple); }
.type-fill { background: var(--gold-light); color: #b7791f; }
.type-sort { background: var(--coral-light); color: var(--coral); }
.type-translate { background: var(--emerald-light); color: var(--emerald-dark); }
.type-question { background: var(--sky-mid); color: var(--navy-mid); }
.type-dialog { background: var(--navy); color: white; }

.question-text {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--navy);
  line-height: 1.6;
  margin-bottom: 6px;
}
.question-jp {
  font-size: 0.85rem;
  color: var(--text-light);
  margin-bottom: 16px;
  line-height: 1.5;
}

/* ===== SPEAK BUTTON ===== */
.speak-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: linear-gradient(135deg, var(--navy-mid), var(--navy));
  color: white;
  border: none;
  border-radius: 30px;
  padding: 7px 14px;
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 12px;
}
.speak-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(30,58,95,0.3); }
.speak-btn.speaking { background: linear-gradient(135deg, var(--emerald), var(--emerald-dark)); }

/* ===== CHOICES ===== */
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice-btn {
  text-align: left;
  background: var(--white);
  border: 2.5px solid #e2e8f0;
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  font-family: 'Quicksand', sans-serif;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--text);
}
.choice-btn:hover { border-color: var(--emerald); background: var(--emerald-light); }
.choice-btn.correct { border-color: var(--emerald); background: var(--emerald-light); color: var(--emerald-dark); }
.choice-btn.wrong { border-color: var(--coral); background: var(--coral-light); color: var(--coral); }

/* ===== INPUT ===== */
.answer-input {
  width: 100%;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  border: 2.5px solid #e2e8f0;
  font-family: 'Quicksand', sans-serif;
  font-size: 1rem;
  font-weight: 600;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
  background: var(--white);
}
.answer-input:focus { border-color: var(--emerald); }
.answer-input.correct { border-color: var(--emerald); background: var(--emerald-light); }
.answer-input.wrong { border-color: var(--coral); background: var(--coral-light); }

/* ===== SORT TOKENS ===== */
.sort-area { display: flex; flex-wrap: wrap; gap: 8px; min-height: 44px; padding: 8px; border: 2px dashed #cbd5e0; border-radius: var(--radius-sm); background: rgba(255,255,255,0.7); margin-bottom: 10px; }
.sort-bank { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.token {
  background: var(--navy);
  color: white;
  padding: 7px 14px;
  border-radius: 20px;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  user-select: none;
  transition: all 0.15s;
  font-family: 'Nunito', sans-serif;
}
.token:hover { transform: translateY(-2px); background: var(--navy-mid); }
.token.in-area { background: var(--emerald-dark); }

/* ===== FEEDBACK ===== */
.feedback {
  display: none;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 0.9rem;
  margin-top: 12px;
  line-height: 1.5;
}
.feedback.show { display: block; }
.feedback.correct-fb { background: var(--emerald-light); color: var(--emerald-dark); border-left: 4px solid var(--emerald); }
.feedback.wrong-fb { background: var(--coral-light); color: #c53030; border-left: 4px solid var(--coral); }

/* ===== BUTTONS ===== */
.btn-primary {
  background: linear-gradient(135deg, var(--emerald), var(--emerald-dark));
  color: white;
  border: none;
  border-radius: 30px;
  padding: 12px 28px;
  font-family: 'Nunito', sans-serif;
  font-size: 0.95rem;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 12px;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(52,201,138,0.35); }
.btn-secondary {
  background: var(--white);
  color: var(--navy);
  border: 2.5px solid var(--navy);
  border-radius: 30px;
  padding: 10px 22px;
  font-family: 'Nunito', sans-serif;
  font-size: 0.88rem;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 10px;
  margin-left: 8px;
}
.btn-secondary:hover { background: var(--navy); color: white; }

/* ===== PROGRESS BAR ===== */
.progress-wrap { background: #e2e8f0; border-radius: 10px; height: 8px; margin-bottom: 16px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 10px; background: linear-gradient(90deg, var(--emerald), var(--gold)); transition: width 0.5s ease; }

/* ===== SHADOWING PANEL ===== */
.shadow-example {
  background: linear-gradient(135deg, var(--navy), var(--navy-mid));
  border-radius: var(--radius);
  padding: 20px 24px;
  color: white;
  margin-bottom: 14px;
}
.shadow-en { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
.shadow-jp { font-size: 0.85rem; opacity: 0.75; }
.shadow-controls { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.shadow-step {
  font-size: 0.78rem;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 20px;
  border: 2px solid rgba(255,255,255,0.4);
  background: rgba(255,255,255,0.1);
  color: white;
  cursor: pointer;
  transition: all 0.2s;
}
.shadow-step:hover, .shadow-step.active { background: var(--emerald); border-color: var(--emerald); }

/* ===== DIALOG ===== */
.dialog-scene-info {
  background: linear-gradient(135deg, var(--navy), var(--navy-mid));
  color: white;
  border-radius: var(--radius) var(--radius) 0 0;
  padding: 16px 20px;
  font-weight: 700;
  font-size: 0.9rem;
}
.dialog-body { padding: 0; }
.dialog-line {
  display: flex;
  gap: 12px;
  padding: 14px 20px;
  border-bottom: 1px solid rgba(226,232,240,0.6);
  align-items: flex-start;
}
.dialog-line:last-child { border-bottom: none; }
.dialog-speaker {
  font-family: 'Nunito', sans-serif;
  font-weight: 900;
  font-size: 0.78rem;
  min-width: 52px;
  padding: 3px 10px;
  border-radius: 20px;
  text-align: center;
  white-space: nowrap;
}
.speaker-a { background: var(--emerald-light); color: var(--emerald-dark); }
.speaker-b { background: var(--purple-light); color: var(--purple); }
.dialog-line-text { flex: 1; }
.dialog-en { font-weight: 700; font-size: 0.95rem; color: var(--navy); }
.dialog-jp { font-size: 0.78rem; color: var(--text-light); margin-top: 2px; }
.dialog-line-controls { display: flex; gap: 6px; align-items: center; }

/* ===== ROLE PLAY ===== */
.role-play-bar {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  padding: 14px 20px;
  background: var(--gold-light);
  border-radius: 0 0 var(--radius) var(--radius);
}
.role-label { font-weight: 800; font-size: 0.85rem; color: #744210; }
.role-select { padding: 6px 12px; border-radius: 20px; border: 2px solid #f6c94e; font-family:'Nunito',sans-serif; font-weight:700; font-size:0.82rem; background:white; cursor:pointer; }
.play-role-btn { background: linear-gradient(135deg, var(--gold), #f6ad55); color: white; border:none; border-radius:30px; padding:8px 18px; font-family:'Nunito',sans-serif; font-weight:800; font-size:0.82rem; cursor:pointer; transition:all 0.2s; }
.play-role-btn:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(246,173,85,0.4); }

/* ===== RESULTS ===== */
.results-card {
  text-align: center;
  padding: 40px 30px;
}
.results-emoji { font-size: 4rem; margin-bottom: 16px; }
.results-title { font-family:'Nunito',sans-serif; font-weight:900; font-size:1.8rem; color:var(--navy); margin-bottom:8px; }
.results-score { font-size:3rem; font-weight:900; color:var(--emerald); font-family:'Nunito',sans-serif; }
.results-msg { color:var(--text-light); font-size:0.95rem; margin-top:8px; margin-bottom:24px; }
.results-stamps { font-size:2rem; margin-bottom:20px; }

/* ===== RESPONSIVE ===== */
@media (max-width: 600px) {
  .card { padding: 18px; }
  .question-text { font-size: 1rem; }
  .score-bar { gap: 10px; }
}

/* ===== ANIMATIONS ===== */
@keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
.card { animation: slideUp 0.3s ease; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
.score-num.bump { animation: pulse 0.3s ease; }

/* ===== MIC INDICATOR ===== */
.mic-bar {
  display: none;
  align-items: center;
  gap: 10px;
  background: var(--coral-light);
  border-radius: var(--radius-sm);
  padding: 10px 16px;
  margin-top: 10px;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--coral);
}
.mic-bar.show { display: flex; }
.mic-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--coral); animation: blink 0.8s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-title">
    <span>🌸</span> Present &amp; Past Tense Practice
  </div>
  <div class="voice-badge" id="voiceBadge">🔊 Loading voice...</div>
</div>

<!-- TABS -->
<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('quiz')">📝 Quiz</button>
  <button class="tab-btn" onclick="switchTab('shadow')">🎙️ Shadowing</button>
  <button class="tab-btn" onclick="switchTab('dialog')">💬 Dialogue</button>
</div>

<!-- ==================== QUIZ TAB ==================== -->
<div class="section-panel active" id="tab-quiz">
  <!-- Level Selector -->
  <div class="card" style="padding:18px 22px; margin-top:16px;">
    <div style="font-family:'Nunito',sans-serif;font-weight:800;font-size:0.85rem;color:var(--navy);margin-bottom:10px;">📊 英検レベルを選んでください</div>
    <div class="level-bar">
      <button class="level-btn active" onclick="setLevel(5,this)">5級</button>
      <button class="level-btn" onclick="setLevel(4,this)">4級</button>
      <button class="level-btn" onclick="setLevel(3,this)">3級</button>
      <button class="level-btn" onclick="setLevel('pre2',this)">準2級</button>
      <button class="level-btn" onclick="setLevel(2,this)">2級</button>
    </div>
  </div>

  <!-- Score Bar -->
  <div class="score-bar">
    <div class="score-item">✅ Correct <span class="score-num" id="scoreCorrect">0</span></div>
    <div class="score-item">❌ Wrong <span class="score-num" id="scoreWrong">0</span></div>
    <div class="score-item">🔥 Streak <span class="score-num" id="scoreStreak">0</span></div>
    <div class="stamps-row" id="stampsRow">
      <span class="stamp">⭐</span><span class="stamp">⭐</span><span class="stamp">⭐</span>
      <span class="stamp">⭐</span><span class="stamp">⭐</span>
    </div>
  </div>

  <!-- Progress -->
  <div class="progress-wrap">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>

  <!-- Question Area -->
  <div id="questionArea"></div>
</div>

<!-- ==================== SHADOWING TAB ==================== -->
<div class="section-panel" id="tab-shadow">
  <div class="card" style="margin-top:16px; padding:18px 22px;">
    <div class="card-title">🎙️ Shadowing Practice</div>
    <div style="font-size:0.85rem;color:var(--text-light);margin-bottom:14px;">英文を聞いて、まねして話す練習です。<br>① Listen → ② Repeat → ③ Shadow（同時に話す）の順で練習しましょう！</div>
    <div class="level-bar">
      <button class="level-btn active" onclick="setShadowLevel(5,this)">5級</button>
      <button class="level-btn" onclick="setShadowLevel(4,this)">4級</button>
      <button class="level-btn" onclick="setShadowLevel(3,this)">3級</button>
      <button class="level-btn" onclick="setShadowLevel('pre2',this)">準2級</button>
      <button class="level-btn" onclick="setShadowLevel(2,this)">2級</button>
    </div>
  </div>
  <div id="shadowingArea"></div>
</div>

<!-- ==================== DIALOGUE TAB ==================== -->
<div class="section-panel" id="tab-dialog">
  <div class="card" style="margin-top:16px; padding:18px 22px;">
    <div class="card-title">💬 Scene Dialogues</div>
    <div style="font-size:0.85rem;color:var(--text-light);margin-bottom:14px;">場面ごとのダイアローグを音声で聞いて、ロールプレイ練習をしましょう！</div>
    <div class="level-bar">
      <button class="level-btn active" onclick="setDialogLevel(5,this)">5級</button>
      <button class="level-btn" onclick="setDialogLevel(4,this)">4級</button>
      <button class="level-btn" onclick="setDialogLevel(3,this)">3級</button>
      <button class="level-btn" onclick="setDialogLevel('pre2',this)">準2級</button>
      <button class="level-btn" onclick="setDialogLevel(2,this)">2級</button>
    </div>
  </div>
  <div id="dialogArea"></div>
</div>

<script>
// ===========================
// VOICE SYSTEM
// ===========================
let bestVoice = null;
const VOICE_PRIORITY = [
  v => /samantha/i.test(v.name),
  v => /google us english/i.test(v.name),
  v => /karen/i.test(v.name),
  v => /zira/i.test(v.name),
  v => v.lang === 'en-US',
  v => v.lang.startsWith('en'),
];
function _pickBestVoice() {
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return null;
  for (const test of VOICE_PRIORITY) {
    const found = voices.find(test);
    if (found) return found;
  }
  return voices[0];
}
function initVoice() {
  bestVoice = _pickBestVoice();
  if (!bestVoice) {
    speechSynthesis.onvoiceschanged = () => {
      bestVoice = _pickBestVoice();
      updateVoiceBadge();
    };
    setTimeout(() => { bestVoice = _pickBestVoice(); updateVoiceBadge(); }, 500);
  } else {
    updateVoiceBadge();
  }
}
function updateVoiceBadge() {
  const badge = document.getElementById('voiceBadge');
  if (bestVoice) {
    badge.textContent = '🔊 ' + bestVoice.name.split(' ').slice(0,2).join(' ');
  } else {
    badge.textContent = '🔊 Default';
  }
}
function speak(text, rate=0.92, onEnd=null) {
  speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  if (bestVoice) utt.voice = bestVoice;
  utt.lang = 'en-US';
  utt.rate = rate;
  utt.pitch = 1.05;
  if (onEnd) utt.onend = onEnd;
  // Chrome stall fix
  const timer = setInterval(() => {
    if (!speechSynthesis.speaking) clearInterval(timer);
    else { speechSynthesis.pause(); speechSynthesis.resume(); }
  }, 10000);
  speechSynthesis.speak(utt);
}
function speakWithBtn(text, btn) {
  btn.classList.add('speaking');
  btn.textContent = '🔊 Speaking...';
  speak(text, 0.88, () => {
    btn.classList.remove('speaking');
    btn.innerHTML = '🔊 Listen';
  });
}
initVoice();

// ===========================
// DATA — QUESTIONS BY LEVEL
// ===========================
const DATA = {
  5: {
    questions: [

  qIndex = 0; correct = 0; wrong = 0; streak = 0; stampsEarned = 0;
  document.getElementById('scoreCorrect').textContent = 0;
  document.getElementById('scoreWrong').textContent = 0;
  document.getElementById('scoreStreak').textContent = 0;
  document.querySelectorAll('.stamp').forEach(s => s.classList.remove('earned'));
  document.getElementById('progressFill').style.width = '0%';
  questions = [...DATA[currentLevel].questions].sort(() => Math.random() - 0.5);
  renderQuestion();
}

function renderQuestion() {
  const area = document.getElementById('questionArea');
  if (qIndex >= questions.length) { showResults(); return; }
  const q = questions[qIndex];
  const pct = Math.round((qIndex / questions.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  answered = false;
  sortSelected = [];

  let typeClass = '', typeLabel = '';
  if (q.type === 'choose') { typeClass='type-choose'; typeLabel='📌 Choose'; }
  else if (q.type === 'fill') { typeClass='type-fill'; typeLabel='✏️ Fill in'; }
  else if (q.type === 'sort') { typeClass='type-sort'; typeLabel='🔀 Sort Words'; }
  else if (q.type === 'translate') { typeClass='type-translate'; typeLabel='🌐 Translate'; }
  else if (q.type === 'question') {
    typeClass='type-question';
    typeLabel = q.qtype==='closed' ? '❓ Closed Question' : '🔓 Open Question';
  }

  let innerHTML = `
    <div class="question-scene">${q.scene}</div>
    <div class="question-type-badge ${typeClass}">${typeLabel}</div>
    <div class="question-text">${q.q}</div>
    ${q.jp ? `<div class="question-jp">🇯🇵 ${q.jp}</div>` : ''}
  `;

  // Speak button for question
  const speakText = q.q.replace(/_+/g,'blank').replace(/\(.*?\)/g,'');
  innerHTML += `<button class="speak-btn" id="speakQBtn" onclick="speakQ('${escQ(speakText)}')">🔊 Listen</button>`;

  // Render by type
  if (q.type === 'choose' || q.type === 'question') {
    innerHTML += `<div class="choices" id="choicesArea">`;
    q.choices.forEach((c, i) => {
      innerHTML += `<button class="choice-btn" id="ch${i}" onclick="checkChoice('${escQ(c)}','${escQ(q.answer)}',${i})">${c}</button>`;
    });
    innerHTML += `</div>`;
  } else if (q.type === 'fill') {
    innerHTML += `<div style="font-size:0.8rem;color:var(--text-light);margin-bottom:6px;">💡 ${q.hint||''}</div>`;
    innerHTML += `<input class="answer-input" id="fillInput" placeholder="Type your answer..." onkeydown="if(event.key==='Enter')checkFill()"/>`;
    innerHTML += `<br><button class="btn-primary" onclick="checkFill()">Check ✓</button>`;
  } else if (q.type === 'sort') {
    const shuffled = [...q.words].sort(() => Math.random() - 0.5);
    innerHTML += `<div class="sort-area" id="sortArea" onclick="handleSortAreaClick(event)"></div>`;
    innerHTML += `<div class="sort-bank" id="sortBank">`;
    shuffled.forEach((w,i) => {
      innerHTML += `<span class="token" id="tok${i}" onclick="addToken('${escQ(w)}','tok${i}')">${w}</span>`;
    });
    innerHTML += `</div>`;
    innerHTML += `<button class="btn-primary" onclick="checkSort()">Check ✓</button>`;
    innerHTML += `<button class="btn-secondary" onclick="clearSort()">Clear</button>`;
  } else if (q.type === 'translate') {
    innerHTML += `<div style="font-size:0.8rem;color:var(--text-light);margin-bottom:6px;">💡 ${q.hint||''}</div>`;
    innerHTML += `<input class="answer-input" id="transInput" placeholder="Type in English..." onkeydown="if(event.key==='Enter')checkTranslate()"/>`;
    innerHTML += `<br><button class="btn-primary" onclick="checkTranslate()">Check ✓</button>`;
  }

  innerHTML += `<div class="feedback" id="feedbackBox"></div>`;

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = innerHTML;
  area.innerHTML = '';
  area.appendChild(card);
}

function escQ(s){ return s.replace(/'/g,"\\'"); }

function speakQ(text){
  const btn = document.getElementById('speakQBtn');
  if(btn) speakWithBtn(text, btn);
}

function checkChoice(chosen, answer, idx) {
  if (answered) return;
  answered = true;
  const isCorrect = chosen.trim().toLowerCase() === answer.trim().toLowerCase();
  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach((b,i) => {
    if (b.textContent.trim().toLowerCase() === answer.trim().toLowerCase()) b.classList.add('correct');
  });
  if (!isCorrect) btns[idx].classList.add('wrong');
  showFeedback(isCorrect, questions[qIndex].expl, answer);
  updateScore(isCorrect);
  addNextButton();
}

function checkFill() {
  if (answered) return;
  const inp = document.getElementById('fillInput');
  if (!inp) return;
  const val = inp.value.trim().toLowerCase();
  const ans = questions[qIndex].answer.trim().toLowerCase();
  const isCorrect = val === ans;
  inp.classList.add(isCorrect ? 'correct' : 'wrong');
  answered = true;
  showFeedback(isCorrect, questions[qIndex].expl, questions[qIndex].answer);
  updateScore(isCorrect);
  addNextButton();
}

function checkTranslate() {
  if (answered) return;
  const inp = document.getElementById('transInput');
  if (!inp) return;
  const val = inp.value.trim().toLowerCase().replace(/[.!?,]/g,'');
  const ans = questions[qIndex].answer.trim().toLowerCase().replace(/[.!?,]/g,'');
  const isCorrect = val === ans;
  inp.classList.add(isCorrect ? 'correct' : 'wrong');
  answered = true;
  showFeedback(isCorrect, questions[qIndex].expl, questions[qIndex].answer);
  updateScore(isCorrect);
  addNextButton();
}

let sortTokens = []; // {word, tokId}
function addToken(word, tokId) {
  const tok = document.getElementById(tokId);
  if (!tok || tok.classList.contains('in-area')) return;
  tok.classList.add('in-area');
  sortTokens.push({word, tokId});
  renderSortArea();
}
function renderSortArea() {
  const area = document.getElementById('sortArea');
  if (!area) return;
  area.innerHTML = '';
  sortTokens.forEach((t,i) => {
    const span = document.createElement('span');
    span.className = 'token in-area';
    span.textContent = t.word;
    span.onclick = () => removeToken(i);
    area.appendChild(span);
  });
}
function removeToken(i) {
  const t = sortTokens[i];
  const orig = document.getElementById(t.tokId);
  if (orig) orig.classList.remove('in-area');
  sortTokens.splice(i,1);
  renderSortArea();
}
function handleSortAreaClick(){}
function clearSort() { sortTokens=[]; document.querySelectorAll('.token').forEach(t=>t.classList.remove('in-area')); renderSortArea(); }
function checkSort() {
  if (answered) return;
  const assembled = sortTokens.map(t=>t.word).join(' ').trim().toLowerCase().replace(/[.!?]/g,'');
  const ans = questions[qIndex].answer.trim().toLowerCase().replace(/[.!?]/g,'');
  const isCorrect = assembled === ans;
  answered = true;
  showFeedback(isCorrect, questions[qIndex].expl, questions[qIndex].answer);
  updateScore(isCorrect);
  addNextButton();
}

function showFeedback(isCorrect, expl, answer) {
  const fb = document.getElementById('feedbackBox');
  if (!fb) return;
  fb.className = 'feedback show ' + (isCorrect ? 'correct-fb' : 'wrong-fb');
  if (isCorrect) {
    const msgs = ['🎉 Excellent! Perfect answer!','✅ Great job!','🌟 That\'s right!','👏 Well done!','💯 Correct!'];
    fb.innerHTML = msgs[Math.floor(Math.random()*msgs.length)] + '<br>' + expl;
    speak(answer);
  } else {
    fb.innerHTML = '❌ Not quite. The answer is: <strong>' + answer + '</strong><br>' + expl;
    speak(answer);
  }
}

function updateScore(isCorrect) {
  if (isCorrect) {
    correct++;
    streak++;
    document.getElementById('scoreCorrect').textContent = correct;
    document.getElementById('scoreStreak').textContent = streak;
    if (streak > 0 && stampsEarned < 5) {
      const stamps = document.querySelectorAll('.stamp');
      stamps[stampsEarned].classList.add('earned');
      stampsEarned++;
    }
  } else {
    wrong++;
    streak = 0;
    document.getElementById('scoreWrong').textContent = wrong;
    document.getElementById('scoreStreak').textContent = 0;
  }
}

function addNextButton() {
  const card = document.querySelector('#questionArea .card');
  if (!card) return;
  const btn = document.createElement('button');
  btn.className = 'btn-primary';
  btn.textContent = qIndex < questions.length - 1 ? 'Next Question →' : 'See Results 🏆';
  btn.style.marginLeft = '8px';
  btn.onclick = () => { qIndex++; renderQuestion(); };
  card.appendChild(btn);
}

function showResults() {
  const total = correct + wrong;
  const pct = total > 0 ? Math.round((correct/total)*100) : 0;
  let emoji = '😊', msg = '';
  if (pct >= 90) { emoji='🏆'; msg='Outstanding! You mastered this level!'; }
  else if (pct >= 70) { emoji='🌟'; msg='Great work! Keep it up!'; }
  else if (pct >= 50) { emoji='💪'; msg='Good effort! Practice makes perfect.'; }
  else { emoji='🌱'; msg='Keep studying — you can do it!'; }
  const stamps = Array.from({length:stampsEarned}, ()=>'⭐').join('');
  document.getElementById('questionArea').innerHTML = `
    <div class="card results-card">
      <div class="results-emoji">${emoji}</div>
      <div class="results-title">Results</div>
      <div class="results-score">${pct}%</div>
      <div class="results-msg">${correct} correct / ${wrong} wrong — ${msg}</div>
      <div class="results-stamps">${stamps || '—'}</div>
      <button class="btn-primary" onclick="resetQuiz()">🔄 Try Again</button>
    </div>`;
}

// ===========================
// SHADOWING ENGINE
// ===========================
let shadowLevel = 5;
function setShadowLevel(lvl, btn) {
  shadowLevel = lvl;
  document.querySelectorAll('#tab-shadow .level-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderShadowing();
}
function renderShadowing() {
  const data = DATA[shadowLevel].shadowing;
  const area = document.getElementById('shadowingArea');
  let html = '';
  data.forEach((s, i) => {
    html += `
    <div class="card" style="padding:20px;">
      <div class="shadow-example">
        <div class="shadow-en">🇺🇸 ${s.en}</div>
        <div class="shadow-jp">🇯🇵 ${s.jp}</div>
        <div class="shadow-controls">
          <button class="shadow-step" onclick="shadowSpeak('${escQ(s.en)}', 0.8, this, 'listen')">① Listen (slow)</button>
          <button class="shadow-step" onclick="shadowSpeak('${escQ(s.en)}', 0.95, this, 'normal')">② Normal speed</button>
          <button class="shadow-step" onclick="startShadow('${escQ(s.en)}', this)">③ Shadow mode 🎙️</button>
        </div>
      </div>
    </div>`;
  });
  area.innerHTML = html;
}
function shadowSpeak(text, rate, btn, mode) {
  document.querySelectorAll('.shadow-step').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  speak(text, rate, () => btn.classList.remove('active'));
}
function startShadow(text, btn) {
  btn.classList.add('active');
  speak(text, 1.0, () => btn.classList.remove('active'));
}

// ===========================
// DIALOGUE ENGINE
// ===========================
let dialogLevel = 5;
function setDialogLevel(lvl, btn) {
  dialogLevel = lvl;
  document.querySelectorAll('#tab-dialog .level-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderDialogs();
}
function renderDialogs() {
  const dialogs = DATA[dialogLevel].dialogues;
  const area = document.getElementById('dialogArea');
  let html = '';
  dialogs.forEach((d, di) => {
    html += `<div class="card" style="padding:0;overflow:hidden;">
      <div class="dialog-scene-info">🎬 ${d.scene} — ${d.sceneJp}</div>
      <div class="dialog-body">`;
    d.lines.forEach((l, li) => {
      html += `
      <div class="dialog-line">
        <div class="dialog-speaker speaker-${l.speaker.toLowerCase()}">${l.speaker}</div>
        <div class="dialog-line-text">
          <div class="dialog-en">${l.en}</div>
          <div class="dialog-jp">${l.jp}</div>
        </div>
        <div class="dialog-line-controls">
          <button class="speak-btn" style="padding:5px 10px;font-size:0.72rem;" onclick="speakDialogLine('${escQ(l.en)}',this)">🔊</button>
        </div>
      </div>`;
    });
    html += `</div>
      <div class="role-play-bar">
        <span class="role-label">🎭 Role Play:</span>
        <span style="font-size:0.82rem;font-weight:600;">Play as</span>
        <select class="role-select" id="roleSelect${di}">
          <option value="A">Speaker A</option>
          <option value="B">Speaker B</option>
        </select>
        <button class="play-role-btn" onclick="playRoleDialog(${di})">▶ Start Role Play</button>
        <button class="play-role-btn" style="background:linear-gradient(135deg,var(--navy-mid),var(--navy));" onclick="playFullDialog(${di})">🔊 Full Audio</button>
      </div>
    </div>`;
  });
  area.innerHTML = html;
}
function speakDialogLine(text, btn) { speakWithBtn(text, btn); }

async function playFullDialog(di) {
  const d = DATA[dialogLevel].dialogues[di];
  for (let i = 0; i < d.lines.length; i++) {
    await new Promise(res => { speak(d.lines[i].en, 0.9, res); setTimeout(res, 4000); });
    await new Promise(res => setTimeout(res, 500));
  }
}
async function playRoleDialog(di) {
  const d = DATA[dialogLevel].dialogues[di];
  const userRole = document.getElementById('roleSelect'+di).value;
  for (let i = 0; i < d.lines.length; i++) {
    const l = d.lines[i];
    if (l.speaker !== userRole) {
      await new Promise(res => { speak(l.en, 0.9, res); setTimeout(res, 4000); });
      await new Promise(res => setTimeout(res, 400));
    } else {
      await new Promise(res => setTimeout(res, 2500));
    }
  }
}

// ===========================
// TAB SWITCHING
// ===========================
function switchTab(name) {
  document.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  event.target.classList.add('active');
}

// ===========================
// INIT
// ===========================
resetQuiz();
renderShadowing();
renderDialogs();
</script>
</body>
</html>
